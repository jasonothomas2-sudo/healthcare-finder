name: Place provider towns on the map

# Runs whenever the provider list (data.js) or the town script changes, and on
# demand. Looks up any new towns and commits towns.js back to the same branch.
on:
  push:
    paths:
      - data.js
      - scripts/geocode-towns.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geocode-towns-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up town locations
        run: node scripts/geocode-towns.js
      - name: Check towns.js loads
        run: |
          node -e "global.window={}; require('./towns.js'); const n=Object.keys(window.JFB_TOWNS).length; if(n<10) throw new Error('too few towns: '+n); console.log(n+' towns OK')"
      - name: Save towns.js
        run: |
          git add towns.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "jfb-holiday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update town locations for Near me"
          git push
