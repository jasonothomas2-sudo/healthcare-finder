name: Holiday sync

# Runs every Monday and on demand. Compares the calculator's holidays with two
# independent sources and commits safe updates to holidays-auto.js by itself.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: holiday-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check sources and update holidays-auto.js
        run: node scripts/sync-holidays.js

      - name: Run tests before publishing
        run: |
          node -e "global.window={}; require('./holidays-auto.js'); require('./holidays-extra.js'); if(!Array.isArray(window.JFB_HOLIDAY_AUTO.add)) throw new Error('bad holidays-auto.js')"
          node --test tests/holidays.test.js

      - name: Publish changes
        run: |
          if git diff --quiet -- holidays-auto.js; then echo "No holiday changes"; exit 0; fi
          git config user.name "jfb-holiday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays-auto.js
          git commit -m "Holiday sync: update automatically confirmed holidays"
          git push

      # GitHub pauses scheduled workflows after 60 days without commits.
      # If the repo has been quiet for 45+ days, add an empty commit to keep this job alive.
      - name: Keep the schedule alive
        run: |
          git pull -q --ff-only || true
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "jfb-holiday-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Holiday sync: keep weekly check active"
            git push
          else
            echo "Recent activity, nothing to do"
          fi

      - name: Leave a note if anything looked odd
        if: hashFiles('holiday-sync-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Holiday sync notes"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file holiday-sync-report.md
          else gh issue create --title "$TITLE" --body-file holiday-sync-report.md; fi
